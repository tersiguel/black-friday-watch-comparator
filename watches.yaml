# ==============================================================================
# Configuration du Comparateur de Prix Black Friday — Montres Solaires Radio-Pilotées
# ==============================================================================
# Tu peux ajouter autant de modèles que tu veux en compétition.
# Pour chaque montre :
#   - target_price : Le prix en € sous lequel c'est une super affaire à acheter
#   - reference_price : Le prix public conseillé (MSRP) officiel pour vérifier les vraies/fausses promos
#   - urls : Colle ici N'IMPORTE QUELLE URL de boutique (Amazon, Ocarat, Montres & Co, Fnac, Cdiscount, Chrono24, etc.)
#   - search_queries : Mots-clés utilisés par le moteur de découverte auto (Dealabs, Idealo, Web)

settings:
  currency: "EUR"
  # Canal ntfy.sh pour recevoir les notifications Web Push directement dans Google Chrome (même onglet fermé)
  # Ouvre https://ntfy.sh/app dans Chrome et abonne-toi à ce sujet :
  ntfy_topic: "bf-montres-solaires-2026"
  ntfy_server: "https://ntfy.sh"
  # Toujours envoyer le récapitulatif quotidien du meilleur prix trouvé (même s'il n'a pas baissé)
  daily_recap: true
  # Activer la découverte automatique de nouvelles offres par référence
  auto_discovery: true
  # Délai maximum par requête HTTP (en secondes)
  request_timeout: 15
  # Activer le fallback Playwright (navigateur headless Chromium) si un site bloque les requêtes simples
  use_playwright_fallback: true

