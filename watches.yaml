# ==============================================================================
# Configuration du Comparateur de Prix Black Friday — Montres Solaires Radio-Pilotées
# ==============================================================================

settings:
  currency: EUR
  ntfy_topic: bf-montres-solaires-2026
  ntfy_server: https://ntfy.sh
  daily_recap: true
  auto_discovery: true
  request_timeout: 15
  use_playwright_fallback: true
  # Paramètres automatiques d'importation hors-UE (ex: Sakura Watches à Tokyo vers la France via DHL/FedEx)
  japan_import:
    shipping_eur: 24.0      # Port express assuré Japon -> France (~24 €)
    vat_rate: 0.20          # TVA française à l'importation (20 % sur montre + port + douane)
    customs_duty_eur: 0.80  # Droit de douane horlogerie UE plafonné à 0,80 € (HS 9102)
    carrier_fee_eur: 18.0   # Frais de dédouanement / avance de fonds transporteur (DHL/FedEx ~18 €)

